[package]
name = "coppersmith"
version = "0.1.0"
edition = "2024"
description = "Lay out printed circuit boards: place parts, route copper, check the rules, and write Gerbers."

[[bin]]
name = "coppersmith"
path = "src/main.rs"

[dependencies]
earcut = "0.4"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wayland", "x11"] }
png = "0.18"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Trackpad pinches on Linux, which the window library doesn't pass on.
libc = "0.2"
raw-window-handle = "0.6"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }

[profile.dev]
opt-level = 2
debug = false
strip = true

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
strip = true
lto = true
codegen-units = 1
