[package]
name = "coppersmith"
version = "0.3.16"
edition = "2024"
rust-version = "1.88"
description = "Lay out printed circuit boards: place parts, route copper, check the rules, and write Gerbers."

[[bin]]
name = "coppersmith"
path = "src/main.rs"

[dependencies]
cfb = "0.16.0"
earcut = "0.4"
eframe = { version = "0.37.0", default-features = false, features = ["glow"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
i_overlay = "9.1"
png = "0.18"
rfd = { version = "0.17.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Linux: both kinds of desktop, file dialogs through the desktop portal, and
# trackpad pinches heard from Wayland, which the window library doesn't pass on.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wayland", "x11"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
libc = "0.2"
raw-window-handle = "0.6"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }

[profile.dev]
opt-level = 2
debug = false
strip = true

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
strip = true
lto = true
codegen-units = 1
