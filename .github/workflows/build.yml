name: Build

# Builds are for what's going to be merged, not for every push:
# - pushes to master (what was merged),
# - pull requests that are ready for review (drafts are skipped; marking one
#   ready builds it), each new push cancelling the build it makes obsolete,
# - by hand, from the Actions tab.
# Pushing to a branch with no pull request, or to a draft, costs nothing.
# Changes to docs alone don't build.
on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE*"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE*"
  workflow_dispatch:

# One build per branch or pull request at a time: a newer push cancels the older.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Not for draft pull requests.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: target/release/coppersmith
          - os: macos-latest
            artifact: target/Coppersmith.app
          - os: windows-latest
            artifact: target/release/coppersmith.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Keeps the compiled dependencies between builds.
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
      # The tests in the release profile, so the build after them reuses what they compiled.
      - run: cargo test --release
      - run: cargo build --release
      - name: Mac app
        if: runner.os == 'macOS'
        run: sh packaging/macos/make-app.sh
      - name: Windows installer
        if: runner.os == 'Windows'
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          powershell -ExecutionPolicy Bypass -File packaging\windows\make-installer.ps1
      - name: Gerbers from the sample board
        shell: bash
        run: |
          ./target/release/coppersmith --write-sample sample.cspcb
          ./target/release/coppersmith sample.cspcb --check
          ./target/release/coppersmith sample.cspcb --gerbers gerbers
      - uses: actions/upload-artifact@v4
        with:
          name: coppersmith-${{ runner.os }}
          path: ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: coppersmith-Windows-setup
          path: target/coppersmith-*-setup.exe
